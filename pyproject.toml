[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quant-research"
version = "0.1.0"
description = "Structured Agentic Quant Research & Deterministic Backtest Loop for Vietnamese Banking Equities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.50.0"]
all-llm = ["google-genai>=1.0.0", "openai>=1.50.0"]

[tool.setuptools.packages.find]
include = ["tools*", "agent*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
